name: Publicar instalador Linux

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  deb:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Determinar versão
        id: versao
        run: |
          if [ "${{ github.ref_type }}" = "tag" ]; then
            echo "valor=${GITHUB_REF_NAME#v}" >> "$GITHUB_OUTPUT"
          else
            echo "valor=1.5.8" >> "$GITHUB_OUTPUT"
          fi

      - name: Preparar wheels (instalação offline)
        run: |
          python -m pip install --upgrade pip
          mkdir -p wheels
          for V in 3.10 3.11 3.12 3.13; do
            python -m pip download --only-binary=:all: --python-version "$V" \
              -d wheels -r requirements.txt
          done
          echo "wheels: $(ls wheels | wc -l) ficheiros"

      - name: Construir pacote .deb
        run: bash build_deb.sh "${{ steps.versao.outputs.valor }}"

      - name: Verificar pacote
        run: |
          PACOTE="dist/aluminio-manager_${{ steps.versao.outputs.valor }}_amd64.deb"
          test -f "$PACOTE"
          dpkg-deb -I "$PACOTE" | head -20
          dpkg-deb -c "$PACOTE" | grep -q "usr/share/aluminio-manager/configurar_bd.sh"
          test -d "/tmp/aluminio-manager_${{ steps.versao.outputs.valor }}/usr/share/aluminio-manager/wheels"
          rm -rf /tmp/ctrl && dpkg-deb -e "$PACOTE" /tmp/ctrl
          bash -n /tmp/ctrl/postinst
          sha256sum "$PACOTE"

      - name: Publicar release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ steps.versao.outputs.valor }}
          name: AluminioManager v${{ steps.versao.outputs.valor }}
          body_path: release-notes.md
          files: dist/*.deb
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  windows:
    needs: deb
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Determinar versão
        id: versao
        shell: bash
        run: echo "valor=${GITHUB_REF_NAME#v}" >> "$GITHUB_OUTPUT"

      - name: Instalar dependências
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt pyinstaller

      - name: Compilar executável
        run: python -m PyInstaller --noconfirm --clean packaging/AluminioManager.spec

      - name: Verificar executável
        shell: bash
        run: |
          ls -lh dist/
          mv dist/AluminioManager.exe "dist/AluminioManager-${{ steps.versao.outputs.valor }}.exe"

      - name: Publicar release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ steps.versao.outputs.valor }}
          body_path: release-notes.md
          files: dist/AluminioManager-*.exe
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
